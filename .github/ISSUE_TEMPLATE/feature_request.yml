name: 💡 Feature request
description: Propose a new capability, command, or change to an agent
labels: ["enhancement", "triage"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Agent (improve an existing one)
        - New agent
        - Slash command
        - CLI / scanner
        - Memory / Obsidian / Notion
        - Protocol (LIAP)
        - Docs
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I'd like to build this myself
